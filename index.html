<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Captune 竞品截图对比</title>

  <style>
    :root {
      --page-bg: #f5f6f8;
      --card-bg: #ffffff;
      --text-main: #202124;
      --text-secondary: #5f6368;
      --border: #dfe3e8;
      --primary: #1a73e8;
      --hover-bg: #f3f7fd;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      padding: 24px;
      color: var(--text-main);
      background: var(--page-bg);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    button,
    img {
      -webkit-tap-highlight-color: transparent;
    }

    /* ==============================
       页面头部
    ============================== */

    .page-header {
      margin-bottom: 26px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .page-header h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }

    .page-meta {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.8;
    }

    /* ==============================
       应用列表
    ============================== */

    .comparison-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .app-card {
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.04),
        0 3px 10px rgba(0, 0, 0, 0.03);
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 80px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .rank {
      flex: 0 0 auto;
      min-width: 48px;
      color: var(--primary);
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
    }

    .app-icon {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      object-fit: cover;
    }

    .app-info {
      min-width: 0;
    }

    .app-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.45;
    }

    .app-title a {
      color: var(--text-main);
      text-decoration: none;
    }

    .app-title a:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    .app-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin-top: 5px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ==============================
       截图横向区域
    ============================== */

    .screenshots-container {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 24px 16px 16px;
      scroll-behavior: smooth;
      scroll-snap-type: x proximity;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      scrollbar-color: #adb3bb transparent;
    }

    .screenshots-container::-webkit-scrollbar {
      height: 9px;
    }

    .screenshots-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .screenshots-container::-webkit-scrollbar-thumb {
      background: #adb3bb;
      border: 2px solid white;
      border-radius: 999px;
    }

    /*
      关键：
      不设置固定宽度。
      每张截图按自身比例决定宽度。

      竖屏图会比较窄；
      横屏图会比较宽；
      所有图片都完整显示，不裁切。
    */

    .screenshot-item {
      position: relative;
      flex: 0 0 auto;
      display: block;
      height: 420px;
      overflow: hidden;
      padding: 0;
      background: #eef1f4;
      border: 1px solid var(--border);
      border-radius: 7px;
      scroll-snap-align: start;
      cursor: zoom-in;
    }

    .screenshot-item img {
      display: block;
      width: auto;
      height: 100%;
      max-width: none;
      object-fit: contain;
      background: #eef1f4;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .screenshot-item:hover img {
      transform: scale(1.012);
      opacity: 0.95;
    }

    .zoom-hint {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 5px 9px;
      color: #fff;
      font-size: 12px;
      line-height: 1;
      background: rgba(0, 0, 0, 0.62);
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .screenshot-item:hover .zoom-hint {
      opacity: 1;
    }

    .empty-state {
      padding: 34px 12px;
      color: #92979d;
      font-size: 14px;
    }

    /* ==============================
       大图预览
    ============================== */

    .lightbox {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px 84px;
      background: rgba(11, 13, 16, 0.92);
      backdrop-filter: blur(5px);
    }

    .lightbox.is-open {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
    }

    .lightbox-image {
      display: block;
      max-width: calc(100vw - 180px);
      max-height: calc(100vh - 120px);
      object-fit: contain;
      border-radius: 7px;
      box-shadow: 0 18px 70px rgba(0, 0, 0, 0.5);
    }

    .lightbox-caption {
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      padding: 0;
      color: #fff;
      font-size: 31px;
      line-height: 1;
      background: rgba(255, 255, 255, 0.12);
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .lightbox-arrow {
      position: fixed;
      top: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 64px;
      padding: 0;
      color: #fff;
      font-size: 40px;
      line-height: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .lightbox-arrow:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .lightbox-arrow:disabled {
      visibility: hidden;
    }

    .lightbox-previous {
      left: 18px;
    }

    .lightbox-next {
      right: 18px;
    }

    /* ==============================
       手机适配
    ============================== */

    @media (max-width: 720px) {
      body {
        padding: 12px;
      }

      .page-header h1 {
        font-size: 24px;
      }

      .page-meta {
        font-size: 13px;
      }

      .app-header {
        gap: 10px;
        min-height: 68px;
        padding: 13px 14px;
      }

      .rank {
        min-width: 38px;
        font-size: 22px;
      }

      .app-icon {
        width: 43px;
        height: 43px;
        border-radius: 10px;
      }

      .app-title {
        font-size: 17px;
      }

      .app-meta {
        font-size: 12px;
      }

      .screenshots-container {
        gap: 10px;
        padding: 16px 10px 12px;
      }

      .screenshot-item {
        height: 330px;
      }

      .lightbox {
        padding: 64px 12px 70px;
      }

      .lightbox-image {
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 150px);
      }

      .lightbox-arrow {
        top: auto;
        bottom: 12px;
        width: 52px;
        height: 44px;
        transform: none;
      }

      .lightbox-previous {
        left: calc(50% - 62px);
      }

      .lightbox-next {
        right: calc(50% - 62px);
      }
    }
  </style>
</head>

        id="lightboxCaption"
      ></div>
    </div>

      id="lightboxNext"

      aria-label="下一张"
    >
      ›
    </button>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImage =
      document.getElementById("lightboxImage");
    const lightboxCaption =
      document.getElementById("lightboxCaption");
    const lightboxClose =
      document.getElementById("lightboxClose");
    const lightboxPrevious =
      document.getElementById("lightboxPrevious");
    const lightboxNext =
      document.getElementById("lightboxNext");

    let activeScreenshots = [];
    let activeImageIndex = 0;
    let activeAppName = "";

    function decodeHtml(value) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = value;
      return textarea.value;
    }

    function updateLightbox() {
      const imageUrl = activeScreenshots[activeImageIndex];

      if (!imageUrl) {
        return;
      }

      lightboxImage.src = imageUrl;
      lightboxImage.alt =
        activeAppName + " 截图 " + (activeImageIndex + 1);

      lightboxCaption.textContent =
        activeAppName +
        " · " +
        (activeImageIndex + 1) +
        " / " +
        activeScreenshots.length;

      lightboxPrevious.disabled =
        activeImageIndex <= 0;

      lightboxNext.disabled =
        activeImageIndex >= activeScreenshots.length - 1;
    }

    function openLightbox(card, index) {
      const encodedScreenshots =
        card.dataset.screenshots || "[]";

      try {
        activeScreenshots = JSON.parse(
          decodeHtml(encodedScreenshots)
        );
      } catch (error) {
        console.error("截图数据解析失败", error);
        activeScreenshots = [];
      }

      activeAppName = card.dataset.appName || "";
      activeImageIndex = index;

      updateLightbox();

      lightbox.classList.add("is-open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImage.src = "";
      document.body.style.overflow = "";
    }

    function showPreviousImage() {
      if (activeImageIndex > 0) {
        activeImageIndex -= 1;
        updateLightbox();
      }
    }

    function showNextImage() {
      if (
        activeImageIndex <
        activeScreenshots.length - 1
      ) {
        activeImageIndex += 1;
        updateLightbox();
      }
    }

    document
      .querySelectorAll(".screenshot-item")
      .forEach((button) => {
        button.addEventListener("click", () => {
          const card = button.closest(".app-card");
          const index = Number(
            button.dataset.imageIndex || 0
          );

          openLightbox(card, index);
        });
      });

    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );

    lightboxPrevious.addEventListener(
      "click",
      showPreviousImage
    );

    lightboxNext.addEventListener(
      "click",
      showNextImage
    );

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (!lightbox.classList.contains("is-open")) {
        return;
      }

      if (event.key === "Escape") {
        closeLightbox();
      }

      if (event.key === "ArrowLeft") {
        showPreviousImage();
      }

      if (event.key === "ArrowRight") {
        showNextImage();
      }
    });
  </script>
