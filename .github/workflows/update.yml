name: 更新竞品截图网页

on:
  workflow_dispatch:

  schedule:
    - cron: "10 1 * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: 下载仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装程序依赖
        run: npm install

      - name: 抓取 Google Play Top 19
        run: npm run update

    - name: 保存最新网页
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add index.html apps-data.json
    git commit -m "Update Google Play Top 19" || exit 0

    git pull --rebase origin main
    git push origin main
